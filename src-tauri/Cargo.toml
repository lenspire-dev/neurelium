[package]
name = "neurelium"
version = "0.0.1"
description = "Neurelium desktop"
authors = ["Neurelium"]
edition = "2021"

[lib]
name = "neurelium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
